[project]
name = "py-xmlvalidate"
version = "0.1.0"
description = "Schematron validation of TEI documents, in the terminal, VS Code and Emacs"
readme = "README.md"
authors = [
    { name = "Nicolas Vaughan", email = "nicolasvaughan@proton.me" }
]
requires-python = ">=3.15"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
py-xmlvalidate = "py_xmlvalidate:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
